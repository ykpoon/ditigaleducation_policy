<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空倉頡打字射擊戰機 - Type Shooter</title>
    <!-- 使用 Tailwind CSS 進行排版與美化 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans select-none">

    <!-- 動態星空背景 -->
    <div class="stars"></div>
    <div class="twinkling"></div>

    <!-- 1. 遊戲開始畫面 -->
    <div id="start-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-opacity duration-500">
        <div class="bg-slate-900/90 border-2 border-cyan-500/50 rounded-2xl p-8 max-w-md w-full shadow-[0_0_30px_rgba(6,182,212,0.3)] backdrop-blur-md">
            <div class="text-center mb-6">
                <div class="text-5xl mb-2">🚀</div>
                <h1 class="text-3xl font-extrabold bg-gradient-to-r from-cyan-400 to-blue-500 bg-clip-text text-transparent">倉頡打字戰機</h1>
                <p class="text-slate-400 mt-2 text-sm">擊落隕石，熟練倉頡與速成解碼！</p>
            </div>

            <form id="start-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">玩家姓名 / 學號</label>
                    <input type="text" id="player-name" required placeholder="例如: Chan Tai Man" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">班別</label>
                    <input type="text" id="class-name" required placeholder="例如: 1A" 
                        class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">起步關卡</label>
                    <select id="start-level" class="w-full bg-slate-950 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="1">第一關：倉頡字根基礎 (單字母)</option>
                        <option value="2">第二關：常用合體字 (2-3 碼)</option>
                        <option value="3">第三關：手冊高難度字 (4-5 碼挑戰)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-cyan-500/20 active:scale-95 transition duration-150 mt-6">
                    開始出擊 <i class="fa-solid fa-plane-departure ml-2"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 遊戲主畫面 -->
    <div id="game-screen" class="hidden fixed inset-0 flex flex-col justify-between">
        <!-- 頂部 HUD 數據列 -->
        <div class="p-4 bg-slate-950/80 border-b border-slate-800 backdrop-blur flex justify-between items-center z-10">
            <div class="flex items-center gap-6">
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider block">駕駛員</span>
                    <span id="hud-player" class="font-semibold text-cyan-400">-</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider block">分數</span>
                    <span id="hud-score" class="font-mono text-xl font-bold text-yellow-400">0</span>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider block">連擊 (Combo)</span>
                    <span id="hud-combo" class="font-mono text-lg font-bold text-emerald-400">0</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <!-- 戰機護盾 (HP) -->
                <div class="w-48">
                    <div class="flex justify-between text-xs text-slate-400 mb-1">
                        <span>護盾能量</span>
                        <span id="hud-shield-pct" class="text-red-400 font-bold">100%</span>
                    </div>
                    <div class="w-full bg-slate-900 rounded-full h-3 border border-slate-800 overflow-hidden">
                        <div id="hud-shield-bar" class="bg-gradient-to-r from-red-500 via-yellow-500 to-emerald-500 h-full w-full transition-all duration-300"></div>
                    </div>
                </div>
                <div>
                    <span class="text-xs text-slate-400 uppercase tracking-wider block">關卡</span>
                    <span id="hud-level" class="font-bold text-xl text-indigo-400">Level 1</span>
                </div>
            </div>
        </div>

        <!-- 遊戲互動區域 (隕石下落區) -->
        <div id="game-area" class="relative flex-1 overflow-hidden">
            <!-- 戰機定位 -->
            <div id="player-ship" class="absolute bottom-6 left-1/2 -translate-x-1/2 flex flex-col items-center transition-all duration-100 z-10">
                <div class="w-12 h-12 bg-contain bg-center relative drop-shadow-[0_0_15px_rgba(6,182,212,0.8)]">
                    <svg viewBox="0 0 64 64" class="w-full h-full fill-cyan-400">
                        <path d="M32 4 L16 40 L24 40 L20 54 L32 46 L44 54 L40 40 L48 40 Z"/>
                        <circle cx="32" cy="24" r="4" fill="#000"/>
                    </svg>
                </div>
                <div class="ship-thruster w-2 h-6 bg-gradient-to-t from-red-500 to-yellow-400 rounded-b-full"></div>
            </div>

            <!-- 雷射與爆炸特效畫布 -->
            <canvas id="laser-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>
        </div>

        <!-- 底部輸入暫存提示 -->
        <div class="p-4 bg-slate-950/90 border-t border-slate-900 flex justify-center items-center z-10">
            <div class="flex items-center gap-4 bg-slate-900 border border-slate-800 px-6 py-3 rounded-xl max-w-md w-full">
                <span class="text-xs text-cyan-400 font-bold uppercase tracking-widest whitespace-nowrap">輸入緩衝區</span>
                <div class="flex-1 flex gap-2 justify-center" id="input-buffer-container">
                    <span class="text-slate-500 text-sm italic">等待輸入...</span>
                </div>
                <button id="clear-buffer-btn" class="text-slate-500 hover:text-red-400 text-xs px-2 py-1 border border-slate-800 hover:border-red-400 rounded transition">
                    清除
                </button>
            </div>
        </div>
    </div>

    <!-- 3. 遊戲結束 / 排行榜結算畫面 -->
    <div id="end-screen" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-opacity duration-500">
        <div class="bg-slate-900/95 border-2 border-emerald-500/50 rounded-2xl p-8 max-w-2xl w-full shadow-[0_0_40px_rgba(16,185,129,0.3)] backdrop-blur-md">
            <div class="text-center mb-6">
                <h2 id="end-title" class="text-4xl font-extrabold text-emerald-400">戰記結算</h2>
                <p class="text-slate-400 mt-1">恭喜完成本次飛行演練！</p>
            </div>

            <!-- 本局成績面板 -->
            <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">最終得分</span>
                    <span id="end-score" class="text-3xl font-bold text-yellow-400 font-mono">0</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">擊鍵精準度</span>
                    <span id="end-accuracy" class="text-3xl font-bold text-cyan-400 font-mono">0%</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">到達關卡</span>
                    <span id="end-level" class="text-3xl font-bold text-indigo-400 font-mono">1</span>
                </div>
            </div>

            <!-- 本地端排行榜 (不連後端) -->
            <div class="mb-6">
                <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-yellow-500"></i> 本機 Top 10 排行榜
                </h3>
                <div class="bg-slate-950 rounded-xl overflow-hidden border border-slate-800 max-h-48 overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-xs font-bold text-slate-400 uppercase border-b border-slate-800">
                                <th class="py-2 px-4">名次</th>
                                <th class="py-2 px-4">班別</th>
                                <th class="py-2 px-4">姓名</th>
                                <th class="py-2 px-4 text-right">最高得分</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="text-sm">
                            <!-- JS 動態渲染本機紀錄 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex gap-4">
                <button id="restart-btn" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg active:scale-95 transition duration-150">
                    重新起飛挑戰 <i class="fa-solid fa-rotate-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 載入純 JS 邏輯 -->
    <script src="game.js"></script>
</body>
</html>
