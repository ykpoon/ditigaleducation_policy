<!DOCTYPE html>
<html lang="zh-HK">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>太空倉頡打字射擊戰機 - Type Shooter</title>
    <!-- 使用 Tailwind CSS 快速排版 -->
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
</head>
<body class="bg-slate-950 text-white overflow-hidden font-sans select-none">

    <!-- 立體網格與太空星河背景 -->
    <div class="stars"></div>
    <div class="space-grid"></div>

    <!-- 1. 遊戲開始畫面 -->
    <div id="start-screen" class="fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-opacity duration-500">
        <div class="bg-slate-900/90 border-2 border-cyan-500/50 rounded-2xl p-8 max-w-md w-full shadow-[0_0_40px_rgba(6,182,212,0.4)] backdrop-blur-md">
            <div class="text-center mb-6">
                <div class="text-5xl mb-3 animate-bounce">🚀</div>
                <h1 class="text-3.5xl font-extrabold bg-gradient-to-r from-cyan-400 via-teal-400 to-blue-500 bg-clip-text text-transparent tracking-wide">
                    倉頡打字戰機
                </h1>
                <p class="text-slate-400 mt-2 text-xs uppercase tracking-widest">Type Fighter: Deep Space</p>
            </div>

            <form id="start-form" class="space-y-4">
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">玩家姓名 / 學號</label>
                    <input type="text" id="player-name" required placeholder="例如: Chan Tai Man" 
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">班別</label>
                    <input type="text" id="class-name" required placeholder="例如: 1A" 
                        class="w-full bg-slate-950/80 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                </div>
                <div>
                    <label class="block text-xs font-semibold text-cyan-400 uppercase tracking-wider mb-1">起步關卡</label>
                    <select id="start-level" class="w-full bg-slate-950/80 border border-slate-800 rounded-lg px-4 py-2 text-white focus:outline-none focus:border-cyan-500 transition">
                        <option value="1">第一關：倉頡基本字根 (速度 +1.3x)</option>
                        <option value="2">第二關：常用合體字 (2-3 碼挑戰)</option>
                        <option value="3">第三關：手冊高難度字 (4-5 碼決戰)</option>
                    </select>
                </div>
                <button type="submit" class="w-full bg-gradient-to-r from-cyan-500 to-blue-600 hover:from-cyan-400 hover:to-blue-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg hover:shadow-cyan-500/20 active:scale-95 transition duration-150 mt-6">
                    啟動戰機出擊 <i class="fa-solid fa-bolt ml-1"></i>
                </button>
            </form>
        </div>
    </div>

    <!-- 2. 遊戲主畫面 (100% 全螢幕無底部緩衝欄) -->
    <div id="game-screen" class="hidden fixed inset-0 flex flex-col justify-between">
        <!-- 頂部精簡 HUD -->
        <div class="p-4 bg-slate-950/40 border-b border-slate-900/50 backdrop-blur-sm flex justify-between items-center z-20">
            <div class="flex items-center gap-8">
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">Pilot</span>
                    <span id="hud-player" class="font-bold text-slate-200 text-sm">-</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">Score</span>
                    <span id="hud-score" class="font-mono text-xl font-black text-yellow-400">0</span>
                </div>
                <div>
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">Combo</span>
                    <span id="hud-combo" class="font-mono text-lg font-extrabold text-emerald-400">0</span>
                </div>
            </div>
            
            <div class="flex items-center gap-6">
                <!-- 數字防護指標 -->
                <div class="text-right">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">Shield</span>
                    <span id="hud-shield-pct" class="font-mono text-sm font-bold text-cyan-400">100%</span>
                </div>
                <!-- 當前關卡 -->
                <div class="text-right">
                    <span class="text-[10px] text-slate-500 uppercase tracking-wider block font-bold">Mission</span>
                    <span id="hud-level" class="font-black text-sm text-indigo-400">Level 1</span>
                </div>
            </div>
        </div>

        <!-- 核心戰場 (隕石下落與雷射 Canvas 區) -->
        <div id="game-area" class="relative flex-1 overflow-hidden">
            
            <!-- 戰機複合體 (含主體、實體能量防護罩、跟隨式緩衝顯示器) -->
            <div id="player-ship" class="absolute bottom-12 left-1/2 -translate-x-1/2 flex flex-col items-center z-10">
                
                <!-- 戰機實體圓形護盾 (動態美化) -->
                <div id="ship-shield" class="absolute w-24 h-24 rounded-full border-4 border-cyan-400/80 flex items-center justify-center transition-all duration-150 pointer-events-none">
                    <!-- 內部防護流光 -->
                    <div class="absolute inset-0 rounded-full bg-cyan-500/5 animate-pulse"></div>
                </div>

                <!-- 炫酷科幻 SVG 戰機 -->
                <div class="w-16 h-16 relative z-10 drop-shadow-[0_0_12px_rgba(6,182,212,0.6)]">
                    <svg viewBox="0 0 64 64" class="w-full h-full">
                        <defs>
                            <linearGradient id="ship-body" x1="0%" y1="0%" x2="100%" y2="100%">
                                <stop offset="0%" stop-color="#06b6d4" />
                                <stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                            <linearGradient id="wing-glow" x1="0%" y1="0%" x2="0%" y2="100%">
                                <stop offset="0%" stop-color="#ec4899" />
                                <stop offset="100%" stop-color="#3b82f6" />
                            </linearGradient>
                        </defs>
                        <!-- 左右機翼副噴氣嘴 -->
                        <path d="M12 44 L4 52 L10 52 Z M52 44 L60 52 L54 52 Z" fill="url(#wing-glow)" />
                        <!-- 後燃主翼與推進器架構 -->
                        <path d="M16 48 L8 40 L16 32 L24 38 Z" fill="#1e293b" />
                        <path d="M48 48 L56 40 L48 32 L40 38 Z" fill="#1e293b" />
                        <!-- 戰機主體 -->
                        <path d="M32 4 L20 28 L14 44 L32 54 L50 44 L44 28 Z" fill="url(#ship-body)" stroke="#ffffff" stroke-width="1" />
                        <!-- 高科技發光駕駛艙 -->
                        <ellipse cx="32" cy="24" rx="5" ry="10" fill="#f59e0b" />
                        <!-- 機翼微型雷射炮口 -->
                        <rect x="18" y="24" width="2" height="8" rx="1" fill="#ef4444" />
                        <rect x="44" y="24" width="2" height="8" rx="1" fill="#ef4444" />
                    </svg>
                </div>

                <!-- 戰機尾部噴射火粒子 -->
                <div class="ship-thruster w-2.5 h-8 bg-gradient-to-t from-red-600 via-orange-400 to-yellow-300 rounded-b-full"></div>
                
                <!-- 跟隨式浮動輸入指示器 (完美替代底部欄，確保視線集中) -->
                <div id="floating-input-badge" class="mt-4 bg-slate-900/90 border border-cyan-500/50 px-3 py-1 rounded-full text-xs font-mono font-bold text-cyan-400 shadow-[0_0_10px_rgba(6,182,212,0.4)] whitespace-nowrap min-w-[80px] text-center transition-all">
                    READY
                </div>
            </div>

            <!-- 動態雷射發射與粒子軌跡 canvas 層 -->
            <canvas id="laser-canvas" class="absolute inset-0 pointer-events-none z-0"></canvas>
        </div>
    </div>

    <!-- 3. 結算與排行榜畫面 -->
    <div id="end-screen" class="hidden fixed inset-0 flex flex-col items-center justify-center z-50 px-4 transition-opacity duration-500">
        <div class="bg-slate-900/95 border-2 border-emerald-500/50 rounded-2xl p-8 max-w-2xl w-full shadow-[0_0_40px_rgba(16,185,129,0.3)] backdrop-blur-md">
            <div class="text-center mb-6">
                <h2 id="end-title" class="text-4xl font-extrabold text-emerald-400 tracking-wider">任務完成</h2>
                <p class="text-slate-400 mt-1 text-sm">數據儲存於本機 LocalStorage</p>
            </div>

            <!-- 成績 -->
            <div class="grid grid-cols-3 gap-4 mb-8 text-center">
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">最終得分</span>
                    <span id="end-score" class="text-3xl font-bold text-yellow-400 font-mono">0</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">精準度</span>
                    <span id="end-accuracy" class="text-3xl font-bold text-cyan-400 font-mono">0%</span>
                </div>
                <div class="bg-slate-950 p-4 rounded-xl border border-slate-800">
                    <span class="text-xs text-slate-500 block mb-1">通關關卡</span>
                    <span id="end-level" class="text-3xl font-bold text-indigo-400 font-mono">1</span>
                </div>
            </div>

            <!-- 本地前十排行榜 -->
            <div class="mb-6">
                <h3 class="text-sm font-bold text-cyan-400 uppercase tracking-widest mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-trophy text-yellow-500"></i> 本機 Top 10 排行榜
                </h3>
                <div class="bg-slate-950 rounded-xl overflow-hidden border border-slate-800 max-h-48 overflow-y-auto">
                    <table class="w-full text-left border-collapse">
                        <thead>
                            <tr class="bg-slate-900 text-xs font-bold text-slate-400 uppercase border-b border-slate-800">
                                <th class="py-2 px-4">名次</th>
                                <th class="py-2 px-4">班別</th>
                                <th class="py-2 px-4">姓名</th>
                                <th class="py-2 px-4 text-right">最高分數</th>
                            </tr>
                        </thead>
                        <tbody id="leaderboard-body" class="text-sm">
                            <!-- JS 動態渲染本機紀錄 -->
                        </tbody>
                    </table>
                </div>
            </div>

            <div class="flex gap-4">
                <button id="restart-btn" class="flex-1 bg-gradient-to-r from-emerald-500 to-teal-600 hover:from-emerald-400 hover:to-teal-500 text-white font-bold py-3 px-4 rounded-lg shadow-lg active:scale-95 transition duration-150">
                    重新起飛挑戰 <i class="fa-solid fa-rotate-right ml-1"></i>
                </button>
            </div>
        </div>
    </div>

    <!-- 載入核心邏輯 -->
    <script src="game.js"></script>
</body>
</html>
